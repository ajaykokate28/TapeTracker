<?xml version="1.0" encoding="UTF-8"?>
<!--
  Splash-screen artwork — gold needle threaded with a measuring-tape
  ribbon. Displayed over MauiSplashScreen BaseColor #0A0A0A.

  Splash is the biggest surface the mark appears on, so this version
  adds numeric labels (1, 2, 3, 4, 5) at three visible ribbon locations
  for extra polish that vanishes gracefully at smaller sizes.
-->
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spNeedleShaft" x1="216" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#78350F"/>
      <stop offset="25%"  stop-color="#B45309"/>
      <stop offset="45%"  stop-color="#FDE68A"/>
      <stop offset="55%"  stop-color="#FEF3C7"/>
      <stop offset="70%"  stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <radialGradient id="spNeedleEye" cx="220" cy="105" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FEF3C7"/>
      <stop offset="55%"  stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>

    <linearGradient id="spRibbon" x1="0" y1="115" x2="0" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FEF3C7"/>
      <stop offset="25%"  stop-color="#FCD34D"/>
      <stop offset="60%"  stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <radialGradient id="spHalo" cx="228" cy="240" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F59E0B" stop-opacity="0.34"/>
      <stop offset="45%"  stop-color="#B45309" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <path id="spRibbonPath"
          d="M 245 115
             C 335 118, 360 200, 250 225
             C 130 250, 128 315, 255 322
             C 355 330, 320 405, 220 400"/>
  </defs>

  <!-- Warm halo -->
  <rect width="456" height="456" fill="url(#spHalo)"/>

  <!-- ═══════════════ RIBBON ═══════════════ -->
  <!-- Outer glow -->
  <use href="#spRibbonPath"
       stroke="#F59E0B" stroke-width="26" stroke-opacity="0.22"
       fill="none" stroke-linecap="round"/>
  <!-- Dark edge stroke -->
  <use href="#spRibbonPath"
       stroke="#3B2508" stroke-width="20"
       fill="none" stroke-linecap="round"/>
  <!-- Main gold body -->
  <use href="#spRibbonPath"
       stroke="url(#spRibbon)" stroke-width="18"
       fill="none" stroke-linecap="round"/>
  <!-- Bright center highlight -->
  <use href="#spRibbonPath"
       stroke="#FEF3C7" stroke-width="3" stroke-opacity="0.55"
       fill="none" stroke-linecap="round"/>

  <!-- Tick marks -->
  <g stroke="#3B2508" stroke-width="1.8" stroke-linecap="butt">
    <line x1="-8" y1="0" x2="8" y2="0" transform="translate(305 148) rotate(115)"/>
    <line x1="-8" y1="0" x2="8" y2="0" transform="translate(322 190) rotate(140)"/>
    <line x1="-8" y1="0" x2="8" y2="0" transform="translate(290 220) rotate(165)"/>
    <line x1="-8" y1="0" x2="8" y2="0" transform="translate(195 240) rotate(15)"/>
    <line x1="-8" y1="0" x2="8" y2="0" transform="translate(155 280) rotate(0)"/>
    <line x1="-8" y1="0" x2="8" y2="0" transform="translate(190 315) rotate(-20)"/>
    <line x1="-8" y1="0" x2="8" y2="0" transform="translate(295 325) rotate(120)"/>
    <line x1="-8" y1="0" x2="8" y2="0" transform="translate(320 365) rotate(150)"/>
    <line x1="-8" y1="0" x2="8" y2="0" transform="translate(265 395) rotate(35)"/>
  </g>
  <g stroke="#FEF3C7" stroke-width="0.9" stroke-opacity="0.75" stroke-linecap="butt">
    <line x1="-8" y1="-1" x2="8" y2="-1" transform="translate(305 148) rotate(115)"/>
    <line x1="-8" y1="-1" x2="8" y2="-1" transform="translate(322 190) rotate(140)"/>
    <line x1="-8" y1="-1" x2="8" y2="-1" transform="translate(290 220) rotate(165)"/>
    <line x1="-8" y1="-1" x2="8" y2="-1" transform="translate(195 240) rotate(15)"/>
    <line x1="-8" y1="-1" x2="8" y2="-1" transform="translate(155 280) rotate(0)"/>
    <line x1="-8" y1="-1" x2="8" y2="-1" transform="translate(190 315) rotate(-20)"/>
    <line x1="-8" y1="-1" x2="8" y2="-1" transform="translate(295 325) rotate(120)"/>
    <line x1="-8" y1="-1" x2="8" y2="-1" transform="translate(320 365) rotate(150)"/>
    <line x1="-8" y1="-1" x2="8" y2="-1" transform="translate(265 395) rotate(35)"/>
  </g>

  <!-- Numeric labels at ~3 visible positions (splash-only polish) -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#3B2508">
    <text x="313" y="176" transform="rotate(30 313 176)">1</text>
    <text x="175" y="275" transform="rotate(85 175 275)">2</text>
    <text x="303" y="355" transform="rotate(30 303 355)">3</text>
  </g>

  <!-- ═══════════════ NEEDLE ═══════════════ -->
  <path d="M 236 135 L 236 380 L 232 408 L 232 135 Z"
        fill="#000000" fill-opacity="0.55"/>
  <path d="M 220 135 L 220 380 L 228 408 L 236 380 L 236 135 Z"
        fill="url(#spNeedleShaft)"
        stroke="#3B2508" stroke-width="0.9" stroke-opacity="0.85"/>
  <rect x="227" y="138" width="1.8" height="240" fill="#FEF3C7" fill-opacity="0.90"/>

  <ellipse cx="228" cy="115" rx="20" ry="24"
           fill="url(#spNeedleEye)"
           stroke="#3B2508" stroke-width="1.1"/>
  <ellipse cx="228" cy="115" rx="10" ry="16" fill="#050505"/>
  <path d="M 219 104 A 10 16 0 0 1 227 100"
        stroke="#FEF3C7" stroke-width="1.3" stroke-opacity="0.6" fill="none"/>
  <ellipse cx="220" cy="102" rx="5.5" ry="6.5" fill="#FEF3C7" fill-opacity="0.78"/>
</svg>
